worker_processes 1;

events { worker_connections 1024; }
http {
    server {
        listen 80;
        server_name _;
        ##### Comment to run on HTTP
        # return 301 https://$host$request_uri;

        ##### Uncomment to run on HTTP
        location / {
            proxy_pass http://frontend.openelis.org;
            proxy_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # API endpoint with CORS support
        location /api/ {
            # Handle CORS preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
                add_header 'Access-Control-Max-Age' '1728000' always;
                add_header 'Content-Length' '0' always;
                add_header 'Content-Type' 'text/plain charset=UTF-8' always;
                return 204;
            }

            proxy_pass https://oe.openelis.org:8443/api/;

            # Rewrite redirect locations from HTTPS to HTTP and fix hostname
            proxy_redirect https://localhost/ http://$host/;
            proxy_redirect https://$host/ http://$host/;
            proxy_redirect https://oe.openelis.org:8443/ http://$host/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Configure SSL verification
            proxy_ssl_verify off;
            proxy_ssl_verify_depth 0;
            proxy_ssl_session_reuse on;
            
            # CRITICAL: Strip Secure flag from cookies so they work over HTTP
            proxy_cookie_flags ~ nosecure;
            
            # Important for authentication
            proxy_pass_header Set-Cookie;
            proxy_cookie_path /OpenELIS-Global /api/OpenELIS-Global;
            
            # Timeouts for long-running requests
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # CORS headers for successful responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
        }
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl default;
        server_name __;

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;

        proxy_set_header X-Forwarded-For $proxy_protocol_addr; # To forward the original client's IP address
        proxy_set_header X-Forwarded-Proto $scheme; # to forward the  original protocol (HTTP or HTTPS)
        proxy_set_header Host $host; # to forward the original host requested by the client

       absolute_redirect off;

        location / {
            proxy_pass http://frontend.openelis.org;
            proxy_redirect     off;
        }

        # API endpoint with CORS support
        location /api/ {
            # Handle CORS preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
                add_header 'Access-Control-Max-Age' '1728000' always;
                add_header 'Content-Length' '0' always;
                add_header 'Content-Type' 'text/plain charset=UTF-8' always;
                return 204;
            }

            proxy_pass         https://oe.openelis.org:8443/api/;

            # Rewrite redirect locations to match client-facing URL
            proxy_redirect https://localhost/ https://$host/;
            proxy_redirect https://oe.openelis.org:8443/ https://$host/;

            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
            proxy_set_header   X-Forwarded-Proto $scheme;
            
            # Configure SSL verification
            proxy_ssl_verify off;
            proxy_ssl_verify_depth 0;
            proxy_ssl_session_reuse on;
            
            # Important for authentication
            proxy_pass_header Set-Cookie;
            proxy_cookie_path /OpenELIS-Global /api/OpenELIS-Global;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # CORS headers for successful responses
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH, HEAD' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
        }
    }
}
